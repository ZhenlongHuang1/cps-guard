[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cps-guard"
version = "0.3.0"
description = "CPS-Guard Pilot-v2: B/G/R features and frozen cross-attack detection"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.5.1",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "joblib>=1.3,<2",
  "sentence-transformers==3.3.1",
  "transformers==4.46.3",
  "accelerate==1.1.1",
  "peft==0.13.2",
  "bitsandbytes==0.45.5",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
