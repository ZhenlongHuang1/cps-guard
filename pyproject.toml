[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cps-guard"
version = "0.2.0"
description = "Modular CPS-Guard pilot and full-experiment research pipeline"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch>=2.4,<3",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "sentence-transformers>=3,<6",
  "transformers>=4.45,<5",
  "accelerate>=1,<2",
  "peft>=0.13,<1",
  "bitsandbytes>=0.45,<1",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
