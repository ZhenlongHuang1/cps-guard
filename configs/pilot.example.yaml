# Copy to configs/pilot.yaml and edit paths. Never commit passwords or API keys.
# Official BackdoorLLM example adapters use Llama-2-7b-chat and a specific task.
# Check that the test data and target behavior match those adapters before ASR.
model_name_or_path: /root/models/llama-2-7b-chat-hf
adapters:
  badnet: /root/models/backdoorllm/badnet
  vpi: /root/models/backdoorllm/vpi
load_in_4bit: true
max_new_tokens: 128
prompt_format: chat_template
random_repeats: 5
random_temperature: 0.7
seed: 20261004
embedding_model: sentence-transformers/all-MiniLM-L6-v2
lambda_randomness: 1.0

# Semantic perturbations use this base model without any attack LoRA.
semantic_max_new_tokens: 512
semantic_temperature: 0.7
